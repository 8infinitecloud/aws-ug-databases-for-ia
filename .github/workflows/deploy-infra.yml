name: Deploy Infrastructure

# Solo se ejecuta manualmente — provisionar infra es una operación deliberada.
on:
  workflow_dispatch:
    inputs:
      labs:
        description: "Labs a desplegar"
        type: choice
        options: [all, lab1, lab2, lab3]
        default: all
      environment:
        description: "Ambiente"
        type: choice
        options: [lab, dev, prod]
        default: lab
      db_password:
        description: "Password para RDS MySQL y Aurora (mín. 8 caracteres)"
        required: true
        default: "FinCorp2026!"

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: fincorp-datalake
  TF_VERSION: "1.9.8"
  # Terraform en CI: sin color y sin preguntas interactivas.
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  # ── LAB 1: VPC + RDS MySQL + DMS + S3 ──────────────────────────────────────
  deploy-lab1:
    name: Deploy Lab 1 (DMS + S3)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    if: inputs.labs == 'all' || inputs.labs == 'lab1'

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}
          role-session-name: gha-lab1-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # El backend.hcl lo genera infra/bootstrap y no se commitea (lleva el
      # account id). En CI se reconstruye a partir de la cuenta asumida.
      - name: Reconstruir backend.hcl
        id: backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ secrets.AWS_REGION || env.AWS_REGION }}"
          BUCKET="${{ env.PROJECT_NAME }}-tfstate-${ACCOUNT_ID}"

          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "::error::No existe el bucket de state '$BUCKET'."
            echo "::error::Ejecuta una vez en local: cd infra/bootstrap && terraform apply"
            exit 1
          fi

          cat > infra/backend.hcl <<EOF
          bucket         = "$BUCKET"
          dynamodb_table = "${{ env.PROJECT_NAME }}-tflock"
          region         = "$REGION"
          encrypt        = true
          EOF

          echo "state_bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "✓ backend.hcl reconstruido (bucket: $BUCKET)"

      - name: terraform init — Lab 1
        run: terraform -chdir=infra/lab1 init -backend-config=../backend.hcl -reconfigure

      - name: terraform apply — Lab 1
        env:
          TF_VAR_db_password: ${{ inputs.db_password }}
          TF_VAR_project_name: ${{ env.PROJECT_NAME }}
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || env.AWS_REGION }}
        run: terraform -chdir=infra/lab1 apply -auto-approve

      - name: Upload dataset to S3
        run: |
          S3_BUCKET=$(terraform -chdir=infra/lab1 output -raw s3_bucket_name)
          aws s3 cp labs/01-ingestion-data-lake/dataset/transactions.csv \
            "s3://${S3_BUCKET}/staging/transactions/transactions.csv"
          aws s3 cp labs/01-ingestion-data-lake/dataset/customers.csv \
            "s3://${S3_BUCKET}/staging/customers/customers.csv"
          echo "✓ Dataset subido a s3://${S3_BUCKET}/staging/"

      - name: Lab 1 summary
        run: |
          {
            echo "### ✅ Lab 1 desplegado"
            echo '```'
            terraform -chdir=infra/lab1 output
            echo '```'
            echo ""
            echo "**Siguiente:** iniciar manualmente la DMS task (\`aws dms start-replication-task\`)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── LAB 2: Glue + DQ + Catalog ──────────────────────────────────────────────
  deploy-lab2:
    name: Deploy Lab 2 (Glue + Quality + Catalog)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [deploy-lab1]
    if: |
      always() &&
      (inputs.labs == 'all' || inputs.labs == 'lab2') &&
      (needs.deploy-lab1.result == 'success' || needs.deploy-lab1.result == 'skipped')

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}
          role-session-name: gha-lab2-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Reconstruir backend.hcl
        id: backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ secrets.AWS_REGION || env.AWS_REGION }}"
          BUCKET="${{ env.PROJECT_NAME }}-tfstate-${ACCOUNT_ID}"

          cat > infra/backend.hcl <<EOF
          bucket         = "$BUCKET"
          dynamodb_table = "${{ env.PROJECT_NAME }}-tflock"
          region         = "$REGION"
          encrypt        = true
          EOF

          echo "state_bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      # El Lab 2 lee el state del Lab 1, asi que este necesita existir.
      - name: terraform init — Lab 1 (solo para leer outputs)
        run: terraform -chdir=infra/lab1 init -backend-config=../backend.hcl -reconfigure

      - name: Subir glue_job.py al data lake
        run: |
          S3_BUCKET=$(terraform -chdir=infra/lab1 output -raw s3_bucket_name)
          if [ -z "$S3_BUCKET" ]; then
            echo "::error::El Lab 1 no esta desplegado: no hay bucket donde subir el script."
            exit 1
          fi
          aws s3 cp labs/02-transformation-quality-catalog/glue_job.py \
            "s3://${S3_BUCKET}/scripts/glue_job.py"
          echo "✓ glue_job.py subido a s3://${S3_BUCKET}/scripts/"

      - name: terraform init — Lab 2
        run: terraform -chdir=infra/lab2 init -backend-config=../backend.hcl -reconfigure

      - name: terraform apply — Lab 2
        env:
          TF_VAR_state_bucket: ${{ steps.backend.outputs.state_bucket }}
          TF_VAR_project_name: ${{ env.PROJECT_NAME }}
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || env.AWS_REGION }}
        run: terraform -chdir=infra/lab2 apply -auto-approve

      - name: Lab 2 summary
        run: |
          {
            echo "### ✅ Lab 2 desplegado"
            echo '```'
            terraform -chdir=infra/lab2 output
            echo '```'
            echo ""
            echo "**Siguiente:** ejecutar el Glue Job (\`labs/02-.../scripts/run_job.sh\`)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ── LAB 3: Aurora + Redis + DynamoDB + EC2 ─────────────────────────────────
  deploy-lab3:
    name: Deploy Lab 3 (RAG)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    if: inputs.labs == 'all' || inputs.labs == 'lab3'

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}
          role-session-name: gha-lab3-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Reconstruir backend.hcl
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ secrets.AWS_REGION || env.AWS_REGION }}"
          cat > infra/backend.hcl <<EOF
          bucket         = "${{ env.PROJECT_NAME }}-tfstate-${ACCOUNT_ID}"
          dynamodb_table = "${{ env.PROJECT_NAME }}-tflock"
          region         = "$REGION"
          encrypt        = true
          EOF

      - name: terraform init — Lab 3
        run: terraform -chdir=infra/lab3 init -backend-config=../backend.hcl -reconfigure

      - name: terraform apply — Lab 3
        env:
          TF_VAR_db_password: ${{ inputs.db_password }}
          TF_VAR_environment_type: ${{ inputs.environment }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || env.AWS_REGION }}
        run: terraform -chdir=infra/lab3 apply -auto-approve

      - name: Lab 3 summary
        run: |
          STREAMLIT_URL=$(terraform -chdir=infra/lab3 output -raw streamlit_url)
          {
            echo "### ✅ Lab 3 desplegado"
            echo '```'
            terraform -chdir=infra/lab3 output
            echo '```'
            echo ""
            echo "**Streamlit URL:** ${STREAMLIT_URL}"
            echo ""
            echo "**Siguiente:** desplegar la app (workflow \`Deploy App\`)."
          } >> "$GITHUB_STEP_SUMMARY"
