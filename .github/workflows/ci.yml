name: CI — Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Lab 3: Python syntax + lint ─────────────────────────────────────────────
  validate-python:
    name: Python syntax & lint (Lab 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax — Lab 3 modules
        run: |
          find labs/03-data-to-ai/ingestion/ labs/03-data-to-ai/query/ labs/03-data-to-ai/app/ labs/03-data-to-ai/scripts/ scripts/ -name "*.py" | while read f; do
            python -c "import ast; ast.parse(open('$f').read())" && echo "✓ $f"
          done

      - name: Check Python syntax — Lab 2 Glue job
        run: |
          python -c "import ast; ast.parse(open('labs/02-transformation-quality-catalog/glue_job.py').read())" \
            && echo "✓ labs/02-transformation-quality-catalog/glue_job.py"

      - name: Install linter
        run: pip install ruff==0.7.0 --quiet

      - name: Lint with ruff — Lab 3 modules
        # E501 ignorado: comentarios inline del lab son deliberadamente descriptivos
        run: |
          ruff check labs/03-data-to-ai/ingestion/ labs/03-data-to-ai/query/ labs/03-data-to-ai/app/ labs/03-data-to-ai/scripts/ scripts/ \
            --ignore E501,F401 \
            --output-format=concise

      - name: Lint with ruff — Lab 2 Glue job
        run: |
          ruff check labs/02-transformation-quality-catalog/glue_job.py \
            --ignore E501,F401 \
            --output-format=concise

  # ── Lab 1 + Lab 2: Shell scripts ────────────────────────────────────────────
  validate-shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: shellcheck — Lab 1 scripts
        run: |
          shellcheck -x --severity=warning labs/01-ingestion-data-lake/scripts/setup.sh
          shellcheck -x --severity=warning labs/01-ingestion-data-lake/scripts/validate.sh
          shellcheck -x --severity=warning labs/01-ingestion-data-lake/scripts/cleanup.sh

      - name: shellcheck — Lab 2 scripts
        run: |
          shellcheck -x --severity=warning labs/02-transformation-quality-catalog/scripts/setup.sh
          shellcheck -x --severity=warning labs/02-transformation-quality-catalog/scripts/run_job.sh
          shellcheck -x --severity=warning labs/02-transformation-quality-catalog/scripts/validate.sh
          shellcheck -x --severity=warning labs/02-transformation-quality-catalog/scripts/cleanup.sh

      - name: shellcheck — Lab 3 infrastructure scripts
        run: |
          shellcheck -x --severity=warning scripts/lib/tf.sh
          shellcheck -x --severity=warning labs/03-data-to-ai/infrastructure/setup.sh
          shellcheck -x --severity=warning labs/03-data-to-ai/infrastructure/deploy-app.sh
          shellcheck -x --severity=warning labs/03-data-to-ai/infrastructure/cleanup.sh

  # ── CloudFormation templates ─────────────────────────────────────────────────
  validate-terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [bootstrap, lab1, lab2, lab3]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform fmt — ${{ matrix.module }}
        run: terraform -chdir=infra/${{ matrix.module }} fmt -check -diff

      # -backend=false: en CI no hay credenciales del backend remoto y no hacen
      # falta para comprobar que la configuracion es valida.
      - name: terraform init — ${{ matrix.module }}
        run: terraform -chdir=infra/${{ matrix.module }} init -backend=false -input=false

      - name: terraform validate — ${{ matrix.module }}
        run: terraform -chdir=infra/${{ matrix.module }} validate

  # ── Datasets + corpus ────────────────────────────────────────────────────────
  validate-data:
    name: Datasets y documentos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar datasets Lab 1
        run: |
          required=(
            "labs/01-ingestion-data-lake/dataset/transactions.csv"
            "labs/01-ingestion-data-lake/dataset/customers.csv"
            "labs/01-ingestion-data-lake/dataset/seed.sql"
          )
          for f in "${required[@]}"; do
            [ -f "$f" ] && echo "✓ $f" || { echo "❌ Missing: $f"; exit 1; }
          done

      - name: Verificar columnas de transactions.csv
        run: |
          HEADER=$(head -1 labs/01-ingestion-data-lake/dataset/transactions.csv)
          EXPECTED="transaction_id,customer_id,amount,currency,transaction_type,status,transaction_date,branch_id"
          if [ "$HEADER" = "$EXPECTED" ]; then
            echo "✓ transactions.csv header correcto"
          else
            echo "❌ Header inesperado: $HEADER"
            echo "   Esperado: $EXPECTED"
            exit 1
          fi

      - name: Verificar columnas de customers.csv
        run: |
          HEADER=$(head -1 labs/01-ingestion-data-lake/dataset/customers.csv)
          EXPECTED="customer_id,name,email,country,risk_level,onboarding_date"
          if [ "$HEADER" = "$EXPECTED" ]; then
            echo "✓ customers.csv header correcto"
          else
            echo "❌ Header inesperado: $HEADER"
            exit 1
          fi

      - name: Verificar conteo de filas en transactions.csv
        run: |
          ROWS=$(wc -l < labs/01-ingestion-data-lake/dataset/transactions.csv)
          # ~1001 (1000 datos + 1 header), con tolerancia
          if [ "$ROWS" -ge 900 ] && [ "$ROWS" -le 1100 ]; then
            echo "✓ transactions.csv: $ROWS líneas (dentro del rango esperado)"
          else
            echo "❌ transactions.csv tiene $ROWS líneas (esperado: 901-1101)"
            exit 1
          fi

      - name: Verificar ruleset DQDL Lab 2
        run: |
          [ -f "labs/02-transformation-quality-catalog/quality_rules.dqdl" ] \
            && echo "✓ quality_rules.dqdl existe" || { echo "❌ Falta quality_rules.dqdl"; exit 1; }
          grep -q "Completeness" labs/02-transformation-quality-catalog/quality_rules.dqdl \
            && echo "✓ Contiene reglas Completeness" || { echo "❌ Sin reglas Completeness"; exit 1; }

      - name: Verificar corpus documentos Lab 3
        run: |
          required=(
            "data/compliance/aml_policy.md"
            "data/compliance/kyc_procedures.md"
            "data/onboarding/client_onboarding.md"
            "data/onboarding/employee_onboarding.md"
            "data/policies/data_privacy.md"
            "data/policies/risk_management.md"
            "data/policies/acceptable_use.md"
          )
          for f in "${required[@]}"; do
            [ -f "$f" ] && echo "✓ $f" || { echo "❌ Missing: $f"; exit 1; }
          done
