name: CI — Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Lab 3: Python syntax + lint ─────────────────────────────────────────────
  validate-python:
    name: Python syntax & lint (Lab 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax — Lab 3 modules
        run: |
          find labs/03-data-to-ai/ingestion/ labs/03-data-to-ai/query/ labs/03-data-to-ai/app/ labs/03-data-to-ai/scripts/ scripts/ -name "*.py" | while read f; do
            python -c "import ast; ast.parse(open('$f').read())" && echo "✓ $f"
          done

      - name: Check Python syntax — Lab 2 Glue job
        run: |
          python -c "import ast; ast.parse(open('labs/02-transformation-quality-catalog/glue_job.py').read())" \
            && echo "✓ labs/02-transformation-quality-catalog/glue_job.py"

      - name: Install linter
        run: pip install ruff==0.7.0 --quiet

      - name: Lint with ruff — Lab 3 modules
        # E501 ignorado: comentarios inline del lab son deliberadamente descriptivos
        run: |
          ruff check labs/03-data-to-ai/ingestion/ labs/03-data-to-ai/query/ labs/03-data-to-ai/app/ labs/03-data-to-ai/scripts/ scripts/ \
            --ignore E501,F401 \
            --output-format=concise

      - name: Lint with ruff — Lab 2 Glue job
        run: |
          ruff check labs/02-transformation-quality-catalog/glue_job.py \
            --ignore E501,F401 \
            --output-format=concise

      - name: Lint with ruff — API de adquirencia (payments)
        run: |
          ruff check payments/backend/ tests/ labs/04-streaming-online-insight/ store/ \
            --ignore E501,F401 \
            --output-format=concise

  # ── Lab 1 + Lab 2: Shell scripts ────────────────────────────────────────────
  validate-shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: shellcheck — Lab 1 scripts
        run: |
          shellcheck -x --severity=warning labs/01-ingestion-data-lake/scripts/setup.sh
          shellcheck -x --severity=warning labs/01-ingestion-data-lake/scripts/validate.sh
          shellcheck -x --severity=warning labs/01-ingestion-data-lake/scripts/cleanup.sh

      - name: shellcheck — Lab 2 scripts
        run: |
          shellcheck -x --severity=warning labs/02-transformation-quality-catalog/scripts/setup.sh
          shellcheck -x --severity=warning labs/02-transformation-quality-catalog/scripts/run_job.sh
          shellcheck -x --severity=warning labs/02-transformation-quality-catalog/scripts/validate.sh
          shellcheck -x --severity=warning labs/02-transformation-quality-catalog/scripts/cleanup.sh

      - name: shellcheck — Lab 4 scripts
        run: |
          shellcheck -x --severity=warning labs/04-streaming-online-insight/scripts/setup.sh
          shellcheck -x --severity=warning labs/04-streaming-online-insight/scripts/validate.sh
          shellcheck -x --severity=warning labs/04-streaming-online-insight/scripts/cleanup.sh
          shellcheck -x --severity=warning labs/04-streaming-online-insight/scripts/run_demo.sh

      - name: shellcheck — Lab 3 infrastructure scripts
        run: |
          shellcheck -x --severity=warning scripts/preflight.sh
          shellcheck -x --severity=warning scripts/lib/tf.sh
          shellcheck -x --severity=warning scripts/lib/core.sh
          shellcheck -x --severity=warning scripts/apply_schema.sh
          shellcheck -x --severity=warning scripts/demo_cierre.sh
          shellcheck -x --severity=warning scripts/deploy_core.sh
          shellcheck -x --severity=warning labs/03-data-to-ai/infrastructure/setup.sh
          shellcheck -x --severity=warning labs/03-data-to-ai/infrastructure/deploy-app.sh
          shellcheck -x --severity=warning labs/03-data-to-ai/infrastructure/cleanup.sh

  # ── CloudFormation templates ─────────────────────────────────────────────────
  # ── Tests del pipeline del Lab 2 (sin AWS) ──────────────────────────────────
  test-pipeline:
    name: Tests del pipeline (pytest)
    runs-on: ubuntu-latest

    # PostgreSQL de verdad, no un doble. Las garantias que prueban los tests de
    # la API son constraints de la base (net = gross - fee, el enum del canal),
    # y una base simulada las daria por buenas sin comprobarlas. Sin este
    # servicio los tests de tests/test_api.py se SALTAN en silencio, que es peor
    # que fallar: el CI se pondria verde sin haberlos ejecutado.
    services:
      postgres:
        image: postgres:16.3-alpine
        env:
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: acquiring
        ports:
          - 55433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet -r requirements.txt
          pip install --quiet -r payments/backend/requirements.txt httpx

      - name: Cargar el esquema del adquirente
        env:
          PGPASSWORD: demo
        run: |
          for f in payments/schema/0*.sql; do
            echo "  $f"
            psql -h localhost -p 55433 -U postgres -d acquiring -q -v ON_ERROR_STOP=1 -f "$f"
          done

      # Ejecutan glue_job.py contra el dataset real. Si alguien recalibra el
      # dataset o toca las reglas, los numeros de los README dejan de cuadrar y
      # estos tests lo dicen.
      # -rs lista los saltados con su motivo. Un test saltado en el CI es un
      # test que no se ejecuto: si el servicio de postgres no arranco, o falta
      # una dependencia, el CI se pondria verde sin haberlo comprobado. Ya paso
      # dos veces: los tests de la API, y el del chunking del corpus, que se
      # saltaba por falta de langchain y llevaba roto sin que nadie lo viera.
      - name: pytest (ningun test puede saltarse)
        run: |
          pytest tests/ -v -rs | tee pytest.out
          if grep -q "SKIPPED" pytest.out; then
            echo "::error::hay tests saltados; un test saltado no comprueba nada"
            exit 1
          fi

  # ── Escaneo de seguridad de la infraestructura ───────────────────────────────
  security-scan:
    name: Seguridad IaC (checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install checkov
        run: pip install checkov==3.3.19 --quiet

      # soft-fail: los hallazgos que quedan abiertos son concesiones
      # deliberadas de un lab, revisadas una por una en docs/well-architected.md.
      # El job informa, no bloquea; lo que importa es que no aparezcan NUEVOS.
      - name: checkov
        run: checkov -d infra --framework terraform --compact --soft-fail

      - name: Resumen
        if: always()
        run: |
          echo "### Escaneo de seguridad de la infraestructura" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Los hallazgos abiertos son concesiones deliberadas de laboratorio." >> "$GITHUB_STEP_SUMMARY"
          echo "Estan revisadas una por una en \`docs/well-architected.md\`." >> "$GITHUB_STEP_SUMMARY"

  validate-terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [bootstrap, payments, lab1, lab2, lab3, lab4]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform fmt — ${{ matrix.module }}
        run: terraform -chdir=infra/${{ matrix.module }} fmt -check -diff

      # -backend=false: en CI no hay credenciales del backend remoto y no hacen
      # falta para comprobar que la configuracion es valida.
      - name: terraform init — ${{ matrix.module }}
        run: terraform -chdir=infra/${{ matrix.module }} init -backend=false -input=false

      - name: terraform validate — ${{ matrix.module }}
        run: terraform -chdir=infra/${{ matrix.module }} validate

  # ── Datasets + corpus ────────────────────────────────────────────────────────
  validate-data:
    name: Datasets y documentos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Estaba roto en tres sitios y nadie lo vio porque el repo nunca se habia
      # subido: exigia customers.csv (ahora merchants.csv), el encabezado del
      # modelo bancario (transaction_type, branch_id) y un seed.sql de MySQL que
      # ya no existe. El contrato de columnas real es la vista del adquirente,
      # y lo comprueba tambien tests/test_glue_job.py.
      - name: Verificar datasets Lab 1 (la cartera legacy)
        run: |
          D=labs/01-ingestion-data-lake/dataset
          for f in "$D/transactions.csv" "$D/merchants.csv" "$D/generate_dataset.py"; do
            [ -f "$f" ] && echo "✓ $f" || { echo "❌ Missing: $f"; exit 1; }
          done
          # tr: el CSV lo escribe el modulo csv de Python, con finales CRLF.
          HEADER=$(head -1 "$D/transactions.csv" | tr -d "\r")
          EXPECTED="transaction_id,customer_id,merchant_name,mcc,risk_level,terminal_id,device_serial,amount,currency,payment_method,status,response_code,rrn,auth_code,fee_amount,net_amount,transaction_date,created_at,captured_at"
          [ "$HEADER" = "$EXPECTED" ] && echo "✓ transactions.csv tiene las columnas de la vista" \
            || { echo "❌ Header inesperado: $HEADER"; exit 1; }
          ROWS=$(($(wc -l < "$D/transactions.csv") - 1))
          [ "$ROWS" -eq 1000 ] && echo "✓ transactions.csv: 1000 filas" \
            || { echo "❌ transactions.csv tiene $ROWS filas (esperado: 1000)"; exit 1; }

      - name: Verificar ruleset DQDL Lab 2
        run: |
          [ -f "labs/02-transformation-quality-catalog/quality_rules.dqdl" ] \
            && echo "✓ quality_rules.dqdl existe" || { echo "❌ Falta quality_rules.dqdl"; exit 1; }
          grep -q "Completeness" labs/02-transformation-quality-catalog/quality_rules.dqdl \
            && echo "✓ Contiene reglas Completeness" || { echo "❌ Sin reglas Completeness"; exit 1; }

      - name: Verificar corpus documentos Lab 3
        run: |
          C=labs/03-data-to-ai/data
          required=(
            "$C/compliance/aml_policy.md"
            "$C/compliance/kyc_procedures.md"
            "$C/compliance/monitoreo_operativo.md"
            "$C/compliance/pagos_online.md"
            "$C/compliance/cartera_legacy.md"
            "$C/operations/runbook_terminales.md"
            "$C/onboarding/client_onboarding.md"
            "$C/onboarding/employee_onboarding.md"
            "$C/policies/data_privacy.md"
            "$C/policies/risk_management.md"
            "$C/policies/acceptable_use.md"
          )
          for f in "${required[@]}"; do
            [ -f "$f" ] && echo "✓ $f" || { echo "❌ Missing: $f"; exit 1; }
          done
