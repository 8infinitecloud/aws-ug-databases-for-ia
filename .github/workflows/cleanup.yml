name: Cleanup — Eliminar recursos AWS

# Solo manual — nunca automático.
# Costos estimados si se dejan corriendo:
#   Lab 1 (RDS + DMS):            ~$0.09/hr
#   Lab 2 (Glue):                 $0 en idle
#   Lab 3 (Aurora + ElastiCache): ~$15-25/día
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribe ELIMINAR para confirmar (irreversible)"
        required: true
      labs:
        description: "Labs a limpiar"
        type: choice
        options: [all, lab1, lab2, lab3, lab4]
        default: all
      environment:
        description: "Ambiente"
        type: choice
        options: [lab, dev, prod]
        default: lab

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: fincorp-datalake
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  # destroy necesita un valor para las variables sin default aunque no lo use.
  TF_VAR_db_password: "placeholder-no-usado-en-destroy"

jobs:
  cleanup:
    name: Eliminar recursos AWS (${{ inputs.labs }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Validar confirmación
        run: |
          if [ "${{ inputs.confirm }}" != "ELIMINAR" ]; then
            echo "❌ Confirmación incorrecta. Escribe exactamente: ELIMINAR"
            exit 1
          fi
          echo "✓ Confirmación válida — iniciando cleanup de: ${{ inputs.labs }}"

      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || env.AWS_REGION }}
          role-session-name: gha-cleanup-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Reconstruir backend.hcl
        id: backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ secrets.AWS_REGION || env.AWS_REGION }}"
          BUCKET="${{ env.PROJECT_NAME }}-tfstate-${ACCOUNT_ID}"

          cat > infra/backend.hcl <<EOF
          bucket         = "$BUCKET"
          dynamodb_table = "${{ env.PROJECT_NAME }}-tflock"
          region         = "$REGION"
          encrypt        = true
          EOF

          echo "state_bucket=$BUCKET" >> "$GITHUB_OUTPUT"

      # ── Lab 2 antes que el Lab 1 ────────────────────────────────────────────
      # El Lab 2 escribe en el bucket que crea el Lab 1, asi que si el Lab 1 se
      # destruye primero, el bucket desaparece con objetos que el Lab 2 aun
      # cree suyos.
      - name: Vaciar prefijos del Lab 2 en el data lake
        if: inputs.labs == 'all' || inputs.labs == 'lab2'
        continue-on-error: true
        run: |
          terraform -chdir=infra/lab1 init -backend-config=../backend.hcl -reconfigure
          S3_BUCKET=$(terraform -chdir=infra/lab1 output -raw s3_bucket_name 2>/dev/null || echo "")

          if [ -z "$S3_BUCKET" ]; then
            echo "⚠️  El Lab 1 no esta desplegado; no hay prefijos que vaciar."
            exit 0
          fi

          for PREFIX in curated/ rejected/ quality-reports/ scripts/; do
            aws s3 rm "s3://${S3_BUCKET}/${PREFIX}" --recursive 2>/dev/null || true
            echo "  ✓ Vaciado ${PREFIX}"
          done

      - name: terraform destroy — Lab 2
        if: inputs.labs == 'all' || inputs.labs == 'lab2'
        continue-on-error: true
        env:
          TF_VAR_state_bucket: ${{ steps.backend.outputs.state_bucket }}
          TF_VAR_project_name: ${{ env.PROJECT_NAME }}
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || env.AWS_REGION }}
        run: |
          terraform -chdir=infra/lab2 init -backend-config=../backend.hcl -reconfigure
          terraform -chdir=infra/lab2 destroy -auto-approve
          echo "✓ Lab 2 destruido"

      # ── Lab 1 ────────────────────────────────────────────────────────────────
      - name: Detener la tarea DMS
        if: inputs.labs == 'all' || inputs.labs == 'lab1'
        continue-on-error: true
        run: |
          terraform -chdir=infra/lab1 init -backend-config=../backend.hcl -reconfigure
          TASK_ARN=$(terraform -chdir=infra/lab1 output -raw dms_task_arn 2>/dev/null || echo "")

          if [ -z "$TASK_ARN" ]; then
            echo "⚠️  Sin tarea DMS que detener."
            exit 0
          fi

          STATUS=$(aws dms describe-replication-tasks \
            --filters "Name=replication-task-arn,Values=${TASK_ARN}" \
            --query "ReplicationTasks[0].Status" --output text 2>/dev/null || echo "unknown")

          if [ "$STATUS" = "running" ]; then
            aws dms stop-replication-task --replication-task-arn "$TASK_ARN" >/dev/null 2>&1 || true
            echo "  Esperando a que la tarea se detenga..."
            for _ in $(seq 1 12); do
              sleep 10
              STATUS=$(aws dms describe-replication-tasks \
                --filters "Name=replication-task-arn,Values=${TASK_ARN}" \
                --query "ReplicationTasks[0].Status" --output text 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "stopped" ] || [ "$STATUS" = "ready" ]; then
                break
              fi
            done
          fi
          echo "  ✓ Tarea DMS en estado: ${STATUS}"

      - name: terraform destroy — Lab 1
        if: inputs.labs == 'all' || inputs.labs == 'lab1'
        env:
          TF_VAR_project_name: ${{ env.PROJECT_NAME }}
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || env.AWS_REGION }}
        run: |
          terraform -chdir=infra/lab1 init -backend-config=../backend.hcl -reconfigure
          # El bucket del data lake tiene force_destroy, asi que destroy se
          # lleva tambien los objetos versionados.
          terraform -chdir=infra/lab1 destroy -auto-approve
          echo "✓ Lab 1 destruido"

      # ── Lab 3 ────────────────────────────────────────────────────────────────
      - name: terraform destroy — Lab 4
        if: inputs.labs == 'all' || inputs.labs == 'lab4'
        continue-on-error: true
        working-directory: .
        run: |
          terraform -chdir=infra/lab4 init -backend-config=../backend.hcl -reconfigure
          terraform -chdir=infra/lab4 destroy -auto-approve

      - name: terraform destroy — Lab 3
        if: inputs.labs == 'all' || inputs.labs == 'lab3'
        env:
          TF_VAR_environment_type: ${{ inputs.environment }}
          TF_VAR_aws_region: ${{ secrets.AWS_REGION || env.AWS_REGION }}
        run: |
          terraform -chdir=infra/lab3 init -backend-config=../backend.hcl -reconfigure
          terraform -chdir=infra/lab3 destroy -auto-approve
          echo "✓ Lab 3 destruido"

      # ── Resumen ──────────────────────────────────────────────────────────────
      - name: Resumen
        if: always()
        run: |
          {
            echo "### 🧹 Cleanup ejecutado (${{ inputs.labs }})"
            echo ""
            echo "| Modulo | Recursos restantes en el state |"
            echo "|--------|-------------------------------|"
            for MODULE in payments lab1 lab2 lab3 lab4; do
              COUNT=$(terraform -chdir="infra/${MODULE}" state list 2>/dev/null | wc -l | tr -d ' ')
              echo "| ${MODULE} | ${COUNT} |"
            done
            echo ""
            echo "El bucket del **state** de Terraform NO se elimina: es donde vive todo lo demas."
          } >> "$GITHUB_STEP_SUMMARY"
