<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Autenticación — Banco emisor simulado</title>
<style>
  :root {
    --fondo: #0f1115;
    --tarjeta: #1a1d24;
    --borde: #2a2f3a;
    --texto: #f2f4f8;
    --tenue: #9aa3b2;
    --acento: #4f8cff;
    --ok: #2ecc71;
    --error: #ff5c5c;
    --aviso: #f5a623;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px 16px;
    background: var(--fondo);
    color: var(--texto);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* El aviso es obligatorio: ni este banco ni este pago existen. */
  .demo {
    width: 100%;
    max-width: 420px;
    padding: 10px 14px;
    border: 1px solid var(--aviso);
    border-radius: 10px;
    background: rgba(245, 166, 35, .1);
    color: var(--aviso);
    font-size: 13px;
    font-weight: 600;
    text-align: center;
  }
  .tarjeta {
    width: 100%;
    max-width: 420px;
    padding: 28px 24px;
    border: 1px solid var(--borde);
    border-radius: 16px;
    background: var(--tarjeta);
    text-align: center;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: var(--tenue); margin: 0 0 22px; }
  .referencia {
    font-size: 12px;
    color: var(--tenue);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    word-break: break-all;
    margin-bottom: 22px;
  }
  button {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: 0;
    border-radius: 12px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #aprobar { background: var(--acento); color: #fff; }
  #rechazar { background: transparent; color: var(--tenue); border: 1px solid var(--borde); }
  button:disabled { opacity: .5; cursor: default; }
  #estado { margin-top: 18px; min-height: 1.5em; }
  .ok { color: var(--ok); }
  .error { color: var(--error); }
</style>
</head>
<body>
<div class="demo">DEMO EDUCATIVA · Banco simulado · No se autentica ni se cobra nada real</div>

<main class="tarjeta">
  <h1>Confirma tu compra</h1>
  <p>Tu banco te pide verificar que eres tú (3-D Secure).</p>
  <div class="referencia" id="referencia"></div>
  <button id="aprobar" type="button">Autenticar</button>
  <button id="rechazar" type="button">No reconozco esta compra</button>
  <div id="estado" role="status"></div>
</main>

<script>
(function () {
  "use strict";

  // Referencia y token vienen en la propia URL: /3ds/PI0001?t=... Nada se
  // inyecta en el HTML, asi que no hay plantilla que escapar.
  var referencia = decodeURIComponent(
    window.location.pathname.replace(/\/+$/, "").split("/").pop() || ""
  );
  var token = new URLSearchParams(window.location.search).get("t") || "";

  var $ = function (id) { return document.getElementById(id); };
  $("referencia").textContent = referencia;

  function estado(texto, clase) {
    $("estado").textContent = texto;
    $("estado").className = clase || "";
  }

  // Solo se vuelve a la tienda por https (o localhost en desarrollo). La API ya
  // lo valida al crear la intencion; esto es la segunda barrera.
  function volver(url, resultado) {
    if (!url || !/^(https:\/\/|http:\/\/(localhost|127\.0\.0\.1)[:/])/.test(url)) {
      return;
    }
    var destino = new URL(url);
    destino.searchParams.set("payment_intent", referencia);
    destino.searchParams.set("status", resultado);
    window.setTimeout(function () { window.location.assign(destino.toString()); }, 1200);
  }

  function enviar(autenticado) {
    $("aprobar").disabled = true;
    $("rechazar").disabled = true;
    estado("Verificando…");

    fetch("/v1/intents/" + encodeURIComponent(referencia) + "/authenticate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token, authenticated: autenticado })
    })
      .then(function (r) {
        return r.json().then(function (cuerpo) { return { ok: r.ok, cuerpo: cuerpo }; });
      })
      .then(function (res) {
        if (!res.ok) {
          estado(res.cuerpo.error || "No se pudo completar la verificación", "error");
          return;
        }
        var c = res.cuerpo;
        if (c.status === "CAPTURED") {
          estado("Pago aprobado. Volviendo a la tienda…", "ok");
        } else {
          estado("Verificación rechazada. Volviendo a la tienda…", "error");
        }
        volver(c.return_url, c.status);
      })
      .catch(function () { estado("Sin conexión con el banco", "error"); });
  }

  if (!token) {
    estado("Falta el código de verificación en el enlace", "error");
    $("aprobar").disabled = true;
    $("rechazar").disabled = true;
    return;
  }
  $("aprobar").addEventListener("click", function () { enviar(true); });
  $("rechazar").addEventListener("click", function () { enviar(false); });
})();
</script>
</body>
</html>
