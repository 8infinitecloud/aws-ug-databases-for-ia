; Terminal POS de FinCorp — M5Stack Core2 for AWS IoT Kit
;
; Las versiones van clavadas, no con rango. El kit es de 2021 y la cadena de
; herramientas de esa epoca es la que funciona: verificado el 2026-09-28
; compilando en 55,7 s (ver docs/architecture-demo-proposal.md, SC-05).

[platformio]
src_dir = main

[env:core2foraws]
platform = espressif32@3.2.1
framework = espidf
board = m5stack-core2
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 2000000
board_build.f_flash = 80000000L
board_build.flash_mode = dio

; El kit desactiva este workaround de la cache de PSRAM: con el activado el
; binario no arranca en el Core2.
build_unflags = -mfix-esp32-psram-cache-issue

board_build.partitions = partitions_16MB.csv

; La CA raiz de Amazon, empotrada en el binario. Es lo que permite validar el
; certificado de API Gateway sin sistema de ficheros.
board_build.embed_txtfiles =
    main/certs/aws-root-ca.pem

; Si PlatformIO no detecta el puerto, descomenta y pon el tuyo:
; upload_port = /dev/cu.usbserial-XXXX
